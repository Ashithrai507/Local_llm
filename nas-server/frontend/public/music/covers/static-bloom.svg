<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Static Bloom album cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160b2e"/>
      <stop offset="0.55" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g transform="translate(300 260)" fill="none" stroke="url(#petal)" stroke-width="3" opacity="0.9">
    <ellipse rx="60" ry="150" transform="rotate(0)"/>
    <ellipse rx="60" ry="150" transform="rotate(60)"/>
    <ellipse rx="60" ry="150" transform="rotate(120)"/>
  </g>
  <circle cx="300" cy="260" r="26" fill="#f9a8d4"/>
  <g stroke="#e2e8f0" stroke-width="1.5" opacity="0.16">
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="390" x2="600" y2="390"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
  </g>
  <text x="48" y="510" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="700" letter-spacing="2">STATIC</text>
  <text x="48" y="558" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="12">BLOOM</text>
</svg>

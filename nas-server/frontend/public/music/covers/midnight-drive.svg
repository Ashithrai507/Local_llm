  </g>
  <text x="48" y="510" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="700" letter-spacing="1">MIDNIGHT</text>
  <text x="48" y="558" fill="#ffb38a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="10">DRIVE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Midnight Drive album cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05050d"/>
      <stop offset="0.6" stop-color="#1b1b3a"/>
      <stop offset="1" stop-color="#3d1b4d"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="470" cy="130" r="58" fill="#f7b731" opacity="0.85"/>
  <circle cx="470" cy="130" r="72" fill="none" stroke="#f7b731" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M140 600 L300 280 L460 600 Z" fill="url(#road)"/>
  <g stroke="#f7b731" stroke-width="3" opacity="0.8">
